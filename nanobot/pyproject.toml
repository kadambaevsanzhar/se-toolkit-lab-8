[project]
name = "nanobot-local"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "nanobot-ai",
  "lms-mcp",
  "mcp-webchat",
  "nanobot-webchat",
]

# nanobot is not a root workspace member so Docker `uv sync` and host both resolve paths.
[tool.uv.sources]
lms-mcp = { path = "../mcp", editable = true }
mcp-webchat = { path = "../nanobot-websocket-channel/mcp-webchat", editable = true }
nanobot-webchat = { path = "../nanobot-websocket-channel/nanobot-webchat", editable = true }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
